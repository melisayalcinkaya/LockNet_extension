# Eğitimi GitHub'ın sunucusunda çalıştırır ve çıkan modeli/ölçümleri aynı dala commit'ler.
name: Egitim
on:
  workflow_dispatch:
    inputs:
      betik:
        description: "training/scripts altındaki betik (ör. train_baseline.py)"
        required: true
        default: train_baseline.py
permissions:
  contents: write
jobs:
  egit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r training/requirements.txt
      - name: Betiğe özel bağımlılıklar
        run: |
          ek="training/requirements-${{ inputs.betik }}"; ek="${ek%.py}.txt"
          if [ -f "$ek" ]; then pip install -r "$ek"; fi
      - name: Eğit
        run: python training/scripts/${{ inputs.betik }}
      - name: Testler
        run: python -m pytest -q training/tests
      - name: Sonuçları commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results extension/model
          git diff --cached --quiet || git commit -m "chore: training results for ${{ inputs.betik }}"
          git push
