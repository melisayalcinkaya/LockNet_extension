name: scratch
on:
  push:
    branches: [toolchain]
    paths: [".github/workflows/scratch.yml"]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: kod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests beautifulsoup4
      - run: mkdir -p ci-out && python kod/training/scripts/collect_web.py ci-out/web_bloklari.jsonl
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add ci-out && git commit -m "ci: web blocks" && git push
