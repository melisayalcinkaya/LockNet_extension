name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r training/requirements.txt
      - name: Python ve JS eşitlik testleri
        run: python -m pytest -q training/tests
