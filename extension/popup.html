<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 1L11.5 6.5H17L12.5 10L14.5 16L9 12.5L3.5 16L5.5 10L1 6.5H6.5L9 1Z" fill="currentColor"/>
        </svg>
      </div>
      <span class="logo-text">LockNet</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Aktif — sayfa taranıyor</span>
  </div>

  <div class="section">
    <div class="section-label">Hassasiyet eşiği</div>
    <div class="threshold-row">
      <input type="range" id="thresholdSlider" min="10" max="90" value="50" step="5">
      <span class="threshold-value" id="thresholdValue">%50</span>
    </div>
    <div class="threshold-desc" id="thresholdDesc">Dengeli — net zararlı içerikler engellenir</div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">Bu oturum</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-num" id="statTarama">—</div>
        <div class="stat-label">taranan</div>
      </div>
      <div class="stat">
        <div class="stat-num danger" id="statEngelendi">—</div>
        <div class="stat-label">engellendi</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">Sitenin durumu</div>
    <div class="site-row">
      <span id="siteHost" class="site-host">—</span>
      <button id="whitelistBtn" class="btn-secondary">Güven listesine ekle</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
