<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <img class="logo-img" src="icons/128.png" width="28" height="28" alt="">
      <span class="logo-text">LockNet</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Aktif</span>
  </div>

  <div class="section">
    <div class="section-label">Hassasiyet</div>
    <div class="mode-row">
      <input type="radio" name="mod" id="modDengeli" value="dengeli"><label for="modDengeli">Dengeli</label>
      <input type="radio" name="mod" id="modTemkinli" value="temkinli"><label for="modTemkinli">Temkinli</label>
    </div>
    <div class="threshold-desc" id="modDesc"></div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">Bu sayfa</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-num" id="statTarama">—</div>
        <div class="stat-label">taranan</div>
      </div>
      <div class="stat">
        <div class="stat-num danger" id="statEngelendi">—</div>
        <div class="stat-label">engellendi</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">Sitenin durumu</div>
    <div class="site-row">
      <span id="siteHost" class="site-host">—</span>
      <button id="whitelistBtn" class="btn-secondary">Güven listesine ekle</button>
    </div>
  </div>

  <div class="privacy">Model tarayıcında çalışır. Okunan metinler hiçbir sunucuya gönderilmez.</div>

  <script src="popup.js"></script>
</body>
</html>
